<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with deep dark gradient -->
  <rect width="1200" height="630" fill="#090a0f"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="blueGlow" x1="600" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#090a0f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(59, 130, 246, 0.5)"/>
      <stop offset="0.5" stop-color="rgba(99, 102, 241, 0.2)"/>
      <stop offset="1" stop-color="rgba(34, 211, 238, 0.4)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Radial Glow Behind Logo -->
  <ellipse cx="600" cy="180" rx="350" ry="180" fill="url(#blueGlow)"/>

  <!-- Outer Frame Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="url(#borderGrad)" stroke-width="2" fill="none"/>

  <!-- Devinsol Logo Mark (Stylized Modern 'D') -->
  <g transform="translate(540, 70)">
    <rect width="120" height="120" rx="28" fill="#0066FF"/>
    <!-- Inner D cutout in white -->
    <path d="M35 32H65C79 32 90 43 90 57C90 71 79 82 65 82H35V32Z" fill="white"/>
    <!-- Modern cut detail -->
    <path d="M35 52H52C58 52 63 57 63 63C63 69 58 74 52 74H35V52Z" fill="#0066FF"/>
    <path d="M35 60L52 82H35V60Z" fill="#0066FF"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(425, 225)">
    <rect width="350" height="38" rx="19" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
    <text x="175" y="24" text-anchor="middle" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">100% FREE PROMOTIONAL WEBSITES</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="325" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">
    Get a Custom Website For Your Business
  </text>
  <text x="600" y="385" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Built Free &amp; Ready to Claim
  </text>

  <!-- Subtitle -->
  <text x="600" y="455" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Explore verified Google Maps businesses with dedicated bespoke digital experiences.
  </text>

  <!-- Footer Badges -->
  <g transform="translate(300, 515)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <circle cx="10" cy="10" r="8" fill="#10B981"/>
      <path d="M6 10L9 13L14 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="15" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">No Hidden Costs</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(220, 0)">
      <circle cx="10" cy="10" r="8" fill="#3B82F6"/>
      <path d="M6 10L9 13L14 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="15" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Google Maps Verified</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(450, 0)">
      <circle cx="10" cy="10" r="8" fill="#8B5CF6"/>
      <path d="M6 10L9 13L14 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="15" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Instant Live Preview</text>
    </g>
  </g>
</svg>
